services:
  zerbit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerbit-app
    restart: unless-stopped
    ports:
      - "8098:80"
    environment:
      APP_NAME: "Zerbit HealthTech Platform"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8098"
      DB_CONNECTION: mysql
      DB_HOST: zerbit-db
      DB_PORT: 3306
      DB_DATABASE: zerbit_db
      DB_USERNAME: zerbit_user
      DB_PASSWORD: ***REMOVED***
      MAIL_MAILER: smtp
      MAIL_HOST: zerbit-mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "no-reply@zerbit.local"
      MAIL_FROM_NAME: "Zerbit HealthTech Portal"
    depends_on:
      zerbit-db:
        condition: service_healthy
    networks:
      - zerbit-network

  zerbit-db:
    image: mariadb:10.11
    container_name: zerbit-db
    restart: unless-stopped
    ports:
      - "3314:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: zerbit_db
      MYSQL_USER: zerbit_user
      MYSQL_PASSWORD: ***REMOVED***
    volumes:
      - zerbit_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zerbit-network

  zerbit-pma:
    image: phpmyadmin:latest
    container_name: zerbit-pma
    restart: unless-stopped
    ports:
      - "8099:80"
    environment:
      PMA_HOST: zerbit-db
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    depends_on:
      - zerbit-db
    networks:
      - zerbit-network

  zerbit-mailpit:
    image: axllent/mailpit:latest
    container_name: zerbit-mailpit
    restart: unless-stopped
    ports:
      - "8027:8025" # Web UI
      - "1026:1025" # SMTP Port
    networks:
      - zerbit-network

networks:
  zerbit-network:
    driver: bridge

volumes:
  zerbit_mariadb_data:
