name: zerbit

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?run make env first}
  APP_URL: ${APP_URL:-http://localhost:8080}
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_DATABASE: zerbit
  DB_USERNAME: zerbit
  DB_PASSWORD: ${DB_PASSWORD:?run make env first}
  LOG_CHANNEL: stderr
  SESSION_ENCRYPT: "true"
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-responder@zerbit.test

services:
  app:
    build:
      context: .
      target: runtime
    image: zerbit-ehr:local
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - private-files:/var/www/html/storage/app/private
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  scheduler:
    image: zerbit-ehr:local
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      SKIP_MIGRATIONS: "true"
    volumes:
      - private-files:/var/www/html/storage/app/private
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: zerbit
      MARIADB_USER: zerbit
      MARIADB_PASSWORD: ${DB_PASSWORD:?run make env first}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Catches every outgoing email; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  mariadb:
  private-files:
